name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm audit --audit-level=high --omit=dev
      - run: npm audit --audit-level=high || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Named rulesets rather than "auto", which needs a Semgrep account and
      # sends metrics. Fails the job on any finding.
      - run: >-
          semgrep scan --error --metrics=off
          --config p/default
          --config p/typescript
          --config p/react
          --config p/nodejs
          --config p/owasp-top-ten
          --config p/secrets
