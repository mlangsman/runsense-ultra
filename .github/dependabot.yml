# Weekly dependency updates, minor and patch versions grouped into one pull
# request each so the CI audit findings get fixed rather than only reported.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
