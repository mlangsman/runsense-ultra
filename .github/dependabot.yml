# Weekly dependency updates, minor and patch versions grouped into one pull
# request each so the CI audit findings get fixed rather than only reported.
# The cooldown waits a week after a release before proposing it, so a
# compromised or broken publish is usually caught upstream first. Dependabot
# also keeps the commit-pinned Actions in the workflows up to date.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types track the runtime: Node 22 on Vercel and in `engines`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next's bundled plugins still peer on eslint 9 (Oct 2026).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
